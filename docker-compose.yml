name: hk-tetracube

services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Bound to loopback only so the DB is reachable for local dev tools but never from the network.
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., target: api }
    image: hk-tetracube-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-tetracube}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      CORS_ORIGIN: https://${SITE_ADDRESS:-localhost}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      mongo: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    image: hk-tetracube-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
